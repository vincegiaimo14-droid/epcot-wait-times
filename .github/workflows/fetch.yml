name: Fetch EPCOT Wait Times

on:
  schedule:
    # Runs at minute 0 of every hour, every day (UTC time)
    - cron: "0 * * * *"
  # Lets you manually trigger a run from the GitHub Actions tab, for testing
  workflow_dispatch:

# Gives this workflow permission to commit files back to the repo
permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run fetch script
        run: python scripts/fetch_waits.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/epcot_waits.json
          git diff --quiet --cached || git commit -m "Update EPCOT wait time data"
          git push
